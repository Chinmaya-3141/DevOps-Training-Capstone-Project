version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: capstone-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=capstone_todos
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - capstone-network

  # Backend API Service  
  backend:
    build: 
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: capstone-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/capstone_todos
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./services/backend:/app
      - /app/node_modules
    networks:
      - capstone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Service
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: capstone-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - capstone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local

networks:
  capstone-network:
    driver: bridge