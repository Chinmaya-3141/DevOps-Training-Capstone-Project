# Prometheus Operator Configuration for Capstone Project
prometheus:
  prometheusSpec:
    # Data retention
    retention: 15d
    retentionSize: 10GB
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    # Resource limits
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    
    # Service monitor selector
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    
    # Pod monitor selector
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    
    # Rule selector
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    
    # Additional scrape configs for custom services
    additionalScrapeConfigs:
      - job_name: 'capstone-frontend'
        static_configs:
          - targets: ['frontend-service.capstone.svc.cluster.local:80']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
        
      - job_name: 'capstone-backend'
        static_configs:
          - targets: ['backend-service.capstone.svc.cluster.local:3000']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
        
      - job_name: 'mongodb-exporter'
        static_configs:
          - targets: ['mongodb-exporter.capstone.svc.cluster.local:9216']
        scrape_interval: 30s
        
      - job_name: 'nginx-exporter'
        static_configs:
          - targets: ['nginx-exporter.capstone.svc.cluster.local:9113']
        scrape_interval: 30s

# Grafana Configuration
grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: admin123
  
  # Service configuration
  service:
    type: ClusterIP
    port: 80
    
  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - capstone-grafana.local
    path: /
    
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  # Persistence
  persistence:
    enabled: true
    type: pvc
    size: 5Gi
    storageClassName: standard
    
  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: 'capstone'
        orgId: 1
        folder: 'Capstone'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/capstone
  
  # Dashboard ConfigMaps
  dashboards:
    default:
      # Kubernetes cluster monitoring
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      
      # Node exporter dashboard
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
        
      # Ingress controller dashboard
      ingress-nginx:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
    
    capstone:
      # Custom application dashboard (will be created)
      application-overview:
        url: https://raw.githubusercontent.com/your-org/capstone-01/main/monitoring/grafana/dashboards/application-overview.json
        datasource: Prometheus
      
      # Database dashboard
      mongodb-dashboard:
        gnetId: 2583
        revision: 2
        datasource: Prometheus
  
  # Data sources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        
  # Environment variables
  env:
    GF_SECURITY_ADMIN_PASSWORD: admin123
    GF_USERS_ALLOW_SIGN_UP: false
    GF_AUTH_DISABLE_LOGIN_FORM: false
    GF_AUTH_ANONYMOUS_ENABLED: false
    GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    
  # SMTP configuration (optional)
  smtp:
    enabled: false
    host: smtp.gmail.com:587
    user: your-email@gmail.com
    password: your-app-password
    
# AlertManager Configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    
    # Resources
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    
    # Configuration
    configSecret: alertmanager-config
    
  # Service configuration
  service:
    type: ClusterIP
    port: 9093

# Node Exporter Configuration
nodeExporter:
  enabled: true
  
# Kube State Metrics Configuration
kubeStateMetrics:
  enabled: true

# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  
  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
      
# Service Monitors for custom applications
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true