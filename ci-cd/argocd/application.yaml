apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: capstone
    app.kubernetes.io/component: application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/your-org/capstone-01
    targetRevision: HEAD
    path: helm-charts
    
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        
  revisionHistoryLimit: 10
  
  info:
    - name: 'Description'
      value: 'DevOps Capstone Project - Microservices Application'
    - name: 'Environment'
      value: 'Development'
    - name: 'Owner'
      value: 'DevOps Team'

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-frontend
  namespace: argocd
  labels:
    app.kubernetes.io/name: capstone
    app.kubernetes.io/component: frontend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/your-org/capstone-01
    targetRevision: HEAD
    path: helm-charts/frontend
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: latest
        - name: replicaCount
          value: "2"
        - name: ingress.enabled
          value: "true"
    
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 1m
        
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-backend
  namespace: argocd
  labels:
    app.kubernetes.io/name: capstone
    app.kubernetes.io/component: backend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/your-org/capstone-01
    targetRevision: HEAD
    path: helm-charts/backend
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: latest
        - name: replicaCount
          value: "2"
        - name: autoscaling.enabled
          value: "true"
    
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 1m
        
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-mongodb
  namespace: argocd
  labels:
    app.kubernetes.io/name: capstone
    app.kubernetes.io/component: database
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: mongodb
    targetRevision: 13.15.1
    helm:
      values: |
        auth:
          enabled: false
        architecture: standalone
        persistence:
          enabled: true
          size: 8Gi
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
        service:
          nameOverride: mongodb-service
    
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        maxDuration: 2m